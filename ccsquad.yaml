workflows:
  dev:
    max_iterations: 10
    phases:
      code:
        description: コードを実装する
        agent: coder
        on:
          completed: review
          failed: plan
      review:
        description: コードレビューを行う
        agent: reviewer
        reviewer: human
        on:
          approved: COMPLETE
          rejected: code
  bugfix:
    description: バグ修正ワークフロー
    max_iterations: 10
    phases:
      investigate:
        description: 原因を調査する
        agent: coder
        pause: true
        on:
          completed: fix
          failed: ABORT
      fix:
        description: 修正を実施する
        agent: coder
        on:
          completed: verify
          failed: investigate
      verify:
        description: 修正を検証する
        agent: reviewer
        on:
          completed: COMPLETE
          failed: fix
