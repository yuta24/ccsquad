workflows:
  dev:
    max_iterations: 10
    phases:
      - name: code
        type: task
        description: コードを実装する
        agent: coder
        on:
          completed: review
          failed: code
      - name: review
        type: review
        description: コードレビューを行う
        reviewer: human
        on:
          approved: COMPLETE
          rejected: code
  plan:
    description: タスクを調査・分解し、ジョブを作成するワークフロー
    max_iterations: 5
    phases:
      - name: analyze
        type: task
        description: タスクの要件を調査し、コードベースを探索して影響範囲を把握する
        agent: requirements-decomposer
        on:
          completed: decompose
          failed: ABORT
      - name: decompose
        type: task
        description: 調査結果をもとにタスクを分解し、個別のジョブを作成する
        agent: requirements-decomposer
        on:
          completed: review
          failed: analyze
      - name: review
        type: review
        description: 分解されたジョブの妥当性をレビューする
        reviewer: human
        on:
          approved: generate
          rejected: decompose
      - name: generate
        type: task
        description: 分解されたジョブを作成する
        agent: requirements-decomposer
        on:
          completed: COMPLETE
          failed: ABORT
  bugfix:
    description: バグ修正ワークフロー
    max_iterations: 10
    phases:
      - name: investigate
        type: task
        description: 原因を調査する
        agent: coder
        on:
          completed: fix
          failed: ABORT
      - name: fix
        type: task
        description: 修正を実施する
        agent: coder
        on:
          completed: verify
          failed: investigate
      - name: verify
        type: review
        description: 修正を検証する
        reviewer: reviewer
        on:
          approved: COMPLETE
          rejected: fix
