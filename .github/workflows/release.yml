name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            asset: ccsquad-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            asset: ccsquad-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: ccsquad-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: ccsquad-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --target=${{ matrix.target }} src/index.ts --outfile dist/${{ matrix.asset }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: dist/${{ matrix.asset }}
