name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            asset: ccsquad-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            asset: ccsquad-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: ccsquad-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: ccsquad-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --target=${{ matrix.target }} src/index.ts --outfile dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          path: dist/
          merge-multiple: true
      - run: cd dist && sha256sum ccsquad-* > SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          files: |
            dist/ccsquad-darwin-arm64
            dist/ccsquad-darwin-x64
            dist/ccsquad-linux-arm64
            dist/ccsquad-linux-x64
            dist/SHA256SUMS
