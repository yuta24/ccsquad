name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: bun-darwin-arm64
            asset: ccsquad-darwin-arm64
          - os: macos-latest
            target: bun-darwin-x64
            asset: ccsquad-darwin-x64
          - os: ubuntu-latest
            target: bun-linux-x64
            asset: ccsquad-linux-x64
          - os: ubuntu-24.04-arm
            target: bun-linux-arm64
            asset: ccsquad-linux-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # v6.0.3
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6  # v2
      - run: bun install --frozen-lockfile
      - run: bun build --compile --target=${{ matrix.target }} src/index.ts --outfile dist/${{ matrix.asset }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: dist/
          merge-multiple: true
      - run: cd dist && sha256sum ccsquad-* > SHA256SUMS
      - uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda  # v3.0.0
        with:
          files: |
            dist/ccsquad-darwin-arm64
            dist/ccsquad-darwin-x64
            dist/ccsquad-linux-arm64
            dist/ccsquad-linux-x64
            dist/SHA256SUMS
